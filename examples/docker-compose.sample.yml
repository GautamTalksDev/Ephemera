# Representative 3-service compose shaped like common public Node+Postgres apps
# (e.g. API + web + Postgres). Used as the Checkpoint 6 importer gate fixture.
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    image: node:22-bookworm-slim
    working_dir: /app
    command: npm run start
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://app:app@db:5432/app
    ports:
      - "3000:3000"
    depends_on:
      - db

  web:
    image: node:22-bookworm-slim
    working_dir: /app
    command: npm run preview -- --host 0.0.0.0 --port 8080
    environment:
      API_URL: http://api:3000
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  pgdata:
